<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="disc" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#263d9e"/>
      <stop offset="0.42" stop-color="#173778"/>
      <stop offset="0.75" stop-color="#0b2257"/>
      <stop offset="1" stop-color="#050a25"/>
    </radialGradient>
    <radialGradient id="sun" cx="44%" cy="38%" r="65%">
      <stop offset="0" stop-color="#74e5ff"/>
      <stop offset="0.36" stop-color="#315bd0"/>
      <stop offset="1" stop-color="#101a5b"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="288" fill="#03071b" stroke="#5bc8ff" stroke-width="4" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="274" fill="url(#disc)" stroke="#73d6ff" stroke-width="2"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="#69cfff" stroke-width="3" filter="url(#soft)"/>
  <circle cx="300" cy="300" r="151" fill="#102b6c" fill-opacity=".72" stroke="#6bdcff" stroke-width="3"/>
  <circle cx="300" cy="300" r="113" fill="#0a1e55" stroke="#518fe3" stroke-width="3"/>
  <circle cx="300" cy="300" r="65" fill="url(#sun)" stroke="#75e9ff" stroke-width="3" filter="url(#soft)"/>

  <g stroke="#8fdfff" stroke-opacity=".72" stroke-width="2">
